<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1232" viewBox="0 0 1240 1232">
<title>Predictive Dynamic-Obstacle Navigation — final ROS 2 / Nav2 architecture</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="1240" height="1232" fill="#fcfcfb"/>
<text x="620" y="44" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="middle">Predictive Dynamic-Obstacle Navigation — final architecture</text>
<text x="620" y="70" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="normal" fill="#52514e" text-anchor="middle">2D LiDAR → tracking → classification → prediction → native Nav2 costmap layer → MPPI</text>
<rect x="390.0" y="100" width="460" height="62" rx="12" ry="12" fill="#eef1f4" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="137.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">2D LiDAR</text>
<text x="620" y="150" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="middle">/scan — single planar scanner, 5 Hz. No camera.</text>
<path d="M620,162 L620,196" stroke="#52514e" stroke-width="2.4" fill="none" marker-end="url(#ah)"/>
<rect x="390.0" y="200" width="460" height="86" rx="12" ry="12" fill="#eef1f4" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="230" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">Static-map rejection → clustering</text>
<text x="620.0" y="253" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">→ compound-observation recovery</text>
<text x="620.0" y="271" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">range-aware rejection radius, track-aware deblending</text>
<path d="M620,286 L620,320" stroke="#52514e" stroke-width="2.4" fill="none" marker-end="url(#ah)"/>
<rect x="390.0" y="324" width="460" height="86" rx="12" ry="12" fill="#eef1f4" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="354" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">Multi-object tracking</text>
<text x="620.0" y="377" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">per-track constant-velocity Kalman filter</text>
<text x="620.0" y="395" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">association, maturity gating, timeout pruning</text>
<path d="M620,410 L620,444" stroke="#52514e" stroke-width="2.4" fill="none" marker-end="url(#ah)"/>
<rect x="390.0" y="448" width="460" height="86" rx="12" ry="12" fill="#eef1f4" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="478" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">Semantic classification</text>
<text x="620.0" y="501" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">geometry features from the LiDAR cluster</text>
<text x="620.0" y="519" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">PED · BIKE · VEHICLE · UNKNOWN (+ confidence)</text>
<path d="M620,534 L620,578" stroke="#52514e" stroke-width="2.4" fill="none"/>
<text x="44.0" y="564" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#898781" text-anchor="start">PREDICTION</text>
<path d="M620,578 L224.0,578" stroke="#2a78d6" stroke-width="2.4" fill="none"/>
