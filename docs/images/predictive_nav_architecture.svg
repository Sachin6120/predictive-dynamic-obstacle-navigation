<path d="M620,762 L620,786" stroke="#52514e" stroke-width="2.4" fill="none" marker-end="url(#ah)"/>
<rect x="270.0" y="790" width="700" height="86" rx="12" ry="12" fill="#eef1f4" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="820" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">Predicted future occupancy + uncertainty</text>
<text x="620.0" y="843" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">published as predictive_nav_msgs/TrackedObjectArray</text>
<text x="620.0" y="861" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">time-parameterised regions over a 3.0 s horizon</text>
<path d="M620,876 L620,910" stroke="#52514e" stroke-width="2.4" fill="none" marker-end="url(#ah)"/>
<rect x="270.0" y="914" width="700" height="100" rx="12" ry="12" fill="#eaf2fd" stroke="#2a78d6" stroke-width="2"/>
<text x="620.0" y="944" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">PredictedObstacleLayer</text>
<text x="620.0" y="967" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">native C++ nav2_costmap_2d plugin — no Nav2 source modified</text>
<text x="620.0" y="985" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">soft, time-decaying cost · updateWithMax · capped below lethal</text>
<text x="620.0" y="1003" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">0.55 m influence window (robot 0.22 + obstacle 0.20 + 0.13 margin)</text>
<path d="M620,1014 L620,1048" stroke="#52514e" stroke-width="2.4" fill="none" marker-end="url(#ah)"/>
<rect x="390.0" y="1052" width="460" height="62" rx="12" ry="12" fill="#eef1f4" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="1089.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">Nav2 local costmap → MPPI controller</text>
<path d="M620,1114 L620,1148" stroke="#52514e" stroke-width="2.4" fill="none" marker-end="url(#ah)"/>
<rect x="500.0" y="1152" width="240" height="50" rx="12" ry="12" fill="#eef1f4" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="1183.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">Robot motion</text>
<text x="620" y="1226" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="normal" fill="#898781" text-anchor="middle" font-style="italic">Production/default path drawn solid; secondary and research predictors dashed. Simulation-validated (Gazebo); no real-world validation.</text>
</svg>
