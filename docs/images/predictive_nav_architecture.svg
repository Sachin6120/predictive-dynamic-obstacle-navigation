<path d="M620,578 L1016.0,578" stroke="#898781" stroke-width="1.8" fill="none" stroke-dasharray="6 5"/>
<path d="M1016.0,578 L1016.0,600" stroke="#898781" stroke-width="1.8" fill="none" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<rect x="38.0" y="620" width="372" height="108" rx="12" ry="12" fill="#eaf2fd" stroke="#2a78d6" stroke-width="2"/>
<text x="224.0" y="650" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">CV-Kalman + covariance</text>
<text x="224.0" y="673" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">propagated state, growing</text>
<text x="224.0" y="691" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">positional uncertainty</text>
<rect x="272.0" y="608" width="128" height="24" rx="12" ry="12" fill="#2a78d6"/>
<text x="336.0" y="624" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">PRODUCTION</text>
<rect x="434.0" y="620" width="372" height="108" rx="12" ry="12" fill="#fdeee7" stroke="#eb6834" stroke-width="2"/>
<text x="620.0" y="650" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">Global reachability</text>
<text x="620.0" y="673" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">bounded-motion set under one</text>
<text x="620.0" y="691" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">declared capability premise</text>
<rect x="679.0" y="608" width="117" height="24" rx="12" ry="12" fill="#eb6834"/>
<text x="737.5" y="624" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">SECONDARY</text>
<rect x="830.0" y="620" width="372" height="108" rx="12" ry="12" fill="#f0efec" stroke="#898781" stroke-width="2"/>
<text x="1016.0" y="650" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">Class-aware reachability</text>
<text x="1016.0" y="673" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">per-class capability profile</text>
<text x="1016.0" y="691" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle">with safe fallback policy</text>
<rect x="1086.0" y="608" width="106" height="24" rx="12" ry="12" fill="#898781"/>
<text x="1139.0" y="624" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">RESEARCH</text>
<path d="M224.0,728 L224.0,762 L620,762" stroke="#2a78d6" stroke-width="2.4" fill="none"/>
<path d="M620.0,728 L620.0,762 L620,762" stroke="#eb6834" stroke-width="1.8" fill="none" stroke-dasharray="6 5"/>
