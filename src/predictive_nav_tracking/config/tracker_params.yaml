lidar_obstacle_tracker:
  ros__parameters:
    scan_topic: "/scan"
    map_topic: "/map"
    map_frame: "map"

    # Static-rejection: reject a transformed scan point if it falls within
    # this radius of a map cell whose occupancy >= occupied_threshold.
    static_reject_radius: 0.15
    occupied_threshold: 65
    unknown_cells_are_static: false

    # Clustering of the surviving (non-static) points.
    cluster_distance: 0.35
    cluster_min_points: 3
    cluster_max_points: 200
    cluster_max_diameter: 1.2

    # Gated nearest-neighbour association + track lifecycle.
    association_gate: 0.6
    track_timeout: 1.0
    max_missed_scans: 5
    min_observations_to_publish: 3
    velocity_history_size: 5

    publish_candidate_markers: true
    velocity_marker_scale: 1.0
    tf_lookup_timeout: 0.1

    # --- Stage-4C: constant-velocity Kalman filter ---
    # 1-sigma unmodeled-acceleration noise (m/s^2), drives Q(dt). Generic
    # slow-indoor-obstacle default (see node comments); not tuned to one run.
    kf_process_accel_noise: 0.5
    # 1-sigma position measurement noise (m), drives R.
    kf_measurement_noise: 0.05
    kf_initial_position_variance: 0.01      # m^2
    kf_initial_velocity_variance: 4.0       # (m/s)^2 -- large: velocity unknown at track birth
    kf_min_dt: 0.001                        # s, numerical safety floor
    kf_max_dt: 1.0                          # s, numerical safety ceiling (== track_timeout)
    min_observations_for_kalman_velocity: 2 # observations before velocity is trusted

    # --- Stage-4C: future trajectory prediction ---
    prediction_horizon: 3.0        # s
    prediction_time_step: 0.5      # s -> samples at 0.5, 1.0, ..., 3.0 s
    uncertainty_ellipse_sigma: 2.0 # ellipse semi-axis = sigma * sqrt(eigenvalue of P_pos)
