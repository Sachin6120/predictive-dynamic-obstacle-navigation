# Stage-5B CLASSIFICATION-ONLY tracker profile.
#
# Derived from tracker_params.yaml (the frozen v1 profile) by changing EXACTLY
# ONE value, documented below. It exists so the classifier can be evaluated
# against vehicle- and bicycle-sized objects at all; it is NOT the navigation
# profile and is NOT used by the Stage-5B navigation integration check, which
# runs on the unmodified tracker_params.yaml.
#
# THE ONE CHANGE: cluster_max_diameter 1.2 -> 5.0 m
#
# WHY IT IS NECESSARY. build_clusters() DISCARDS any connected component whose
# bounding-box diagonal exceeds cluster_max_diameter. The frozen value of
# 1.2 m was chosen at Stage-4B for ~0.4 m cylindrical obstacles and is smaller
# than the scan-plane signature of two of the three target classes:
#
#   actor_pedestrian        footprint diagonal 0.418 m   fits 1.2 m
#   actor_vehicle_compact   footprint diagonal 1.118 m   fits 1.2 m
#   actor_planter           footprint diagonal 1.273 m   EXCEEDS
#   actor_bike              footprint diagonal 1.620 m   EXCEEDS
#   actor_vehicle           footprint diagonal 4.163 m   EXCEEDS
#
# A rejected cluster produces no measurement, no track and therefore no
# classification -- so under the frozen value BIKE and full-size VEHICLE are
# not misclassified, they are invisible. That is a property of the frozen
# clustering envelope, not of the classifier, and widening it here is what
# makes the measurement possible rather than what makes the numbers look good.
#
# WHY 5.0 m: the largest scan-plane signature in the actor catalogue is the
# 3.8 m vehicle flank, whose observed cluster diagonal is ~3.8 m. 5.0 m clears
# it with margin and nothing else.
#
# EVERYTHING ELSE IS IDENTICAL to the frozen profile, deblending included, so
# the geometry the classifier is scored on is produced by the frozen pipeline.
#
lidar_obstacle_tracker:
  ros__parameters:
    scan_topic: "/scan"
    map_topic: "/map"
    map_frame: "map"

    # --- Static rejection (Stage-4G1: range aware) ---------------------
    # A transformed scan point is rejected as STATIC when its distance to the
    # nearest static map cell is <= r_reject(range), where
    #
    #   r_reject(range) = clamp(base_static_margin
    #                           + localization_margin
    #                           + angular_sampling_scale * range,
    #                           static_reject_radius,
    #                           max_static_reject_radius)
    #
    # The distance itself comes from an exact Euclidean distance transform of
    # the map, rebuilt once per map message, so the query is a single lookup.
    #
    # WHY the range term exists (measured, Stage-4G1 section 2): a pose yaw
    # error of dtheta displaces a beam endpoint laterally by range * dtheta, so
    # the mismatch between a wall return and the mapped wall GROWS WITH RANGE
    # while a fixed radius does not. In the 10 x 8 m Stage-4F arena, with the
    # robot driving, the measured residual-retention rate under the old fixed
    # 0.15 m rule rose from 0.00% at 1-2 m to 2.48% at 5-6 m, which is what
    # produced false dynamic tracks there. Stationary, the rate is 0% at every
    # range -- the error is motion-induced, not sensor-intrinsic.
    static_reject_radius: 0.15      # m: MINIMUM radius (and the only radius if
                                    # range_aware_static_rejection is false).
                                    # Unchanged from Stage-4B, so close-range
                                    # behaviour is bit-for-bit the old one.
    range_aware_static_rejection: true
    base_static_margin: 0.06        # m: one 0.05 m map cell of discretisation
                                    # plus ~3 sigma of the 0.01 m range noise.
    localization_margin: 0.06       # m: translation component of the
                                    # map->sensor pose error (measured p95
                                    # 0.118 m while driving; only the part
                                    # normal to a surface displaces a point
                                    # off it).
    angular_sampling_scale: 0.030   # rad: beam half-spacing (0.0087) + pose
                                    # yaw uncertainty (measured p95 0.0262).
    max_static_reject_radius: 0.40  # m: ceiling, so an anomalously long return
                                    # can never blank out a region.
    occupied_threshold: 65
    unknown_cells_are_static: false

    # Clustering of the surviving (non-static) points.
    cluster_distance: 0.35
    cluster_min_points: 3
    cluster_max_points: 200
    # Stage-5B: widened from the frozen 1.2 m. See the header of this file.
    cluster_max_diameter: 5.0

    # --- Stage-4G3: track-aware cluster deblending ---------------------
    # Two obstacles passing close together fall into ONE 0.35 m-connected
    # cluster. The blended centroid can then only feed one track (greedy
    # association is one-to-one), the other track starves and expires, and
    # the identity is lost. Measured at Stage-4G2: 4-5 merged scans per close
    # crossing, 2 ID switches per trial.
    #
    # The fix splits such a cluster using the tracker's OWN Kalman predictions
    # as seeds -- runtime state, never simulator ground truth -- and only when
    # the raw returns show a gap to split on. If one object is physically
    # occluded it contributes no returns, no gap exists, the split is refused
    # and the unobserved track coasts on prediction exactly as before.
    #
    # The thresholds are measured from the 1,197 recorded Stage-4G2 frames,
    # not derived from the simulator's cylinder size:
    #   accepted clusters holding ONE object's returns : max diameter 0.468 m
    #   accepted clusters holding TWO objects' returns : min diameter 0.785 m
    #   largest gap between returns ON one object      : p95 0.147 m, max 0.161 m
    #   smallest gap BETWEEN two merged objects        : 0.123 m (median 0.235 m)
    # Point count is deliberately NOT used as merge evidence: the single-object
    # (max 16) and merged (min 12) distributions overlap, so it does not
    # discriminate. Diameter does, with a 0.32 m margin on either side.
    #
    # Scale merge_min_cluster_diameter / deblend_max_child_diameter with the
    # expected obstacle size if the obstacles are not ~0.4 m across; the rule
    # is "clearly bigger than one tracked object", not a fixed cylinder.
    deblend_enabled: true
    merge_min_cluster_diameter: 0.55   # m: above every observed single object
    merge_track_radius: 0.35           # m: seed-to-nearest-cluster-point claim
    deblend_min_points: 3              # == cluster_min_points; a child must be
                                       # an acceptable measurement on its own
    deblend_max_child_diameter: 0.50   # m: a child must look like one object
    deblend_min_child_separation: 0.30 # m: between the two child centroids
    deblend_min_gap: 0.16              # m: REQUIRED empty space between the two
                                       # point sets; above the 0.161 m worst
                                       # within-object spacing, so a solid blob
                                       # can never be sliced in two
    deblend_use_mahalanobis: true      # ownership uses predicted covariance + R

    # --- Stage-5B.1: gap-aware compound-observation recovery -----------
    # A SECONDARY association stage that re-links two primary clusters which
    # are two slices of ONE rigid object. The measured case is a bicycle: at
    # a ~0.16 m scan plane the sensor sees the two wheel CHORDS, 1.04 m apart
    # with a 0.48-0.54 m hole between them where the frame passes above the
    # plane, so single-link clustering at 0.35 m necessarily splits it. Each
    # fragment is then ~0.51 m long and pedestrian-sized, which is why
    # Stage-5B measured BIKE recall = 0.000.
    #
    # cluster_distance IS NOT CHANGED, AND MUST NOT BE. Stage-4G3 established
    # on 1,197 recorded frames that two genuinely distinct objects at centre
    # separations of 0.46-0.76 m leave an inter-object gap of only
    # 0.12-0.35 m. Raising cluster_distance above the bicycle's 0.48 m gap
    # would merge those too. This stage instead inspects only pairs of
    # clusters that primary clustering ALREADY kept apart, so the Stage-4G3
    # hazard geometry -- whose gaps sit BELOW cluster_distance -- arrives here
    # as one cluster and is handled by the deblender above, never as a pair.
    #
    # Every bound below, its unit, its physical derivation and its measured
    # margin against the negative population are documented at the point of
    # definition in compound_observation.hpp. Summary of the separation, over
    # 333 ray-cast bicycle frames vs 633 distinct-close-pair frames:
    #
    #   per-fragment thickness   bike 0.002-0.071 m   others 0.022-0.185 m
    #   longer fragment length   bike 0.382-0.587 m   others 0.131-0.392 m
    #   fragment/pair |cos|      bike 0.992-1.000     others 0.003-0.999
    #   union thickness          bike 0.007-0.073 m   others 0.048-0.457 m
    #
    # Acceptance: 322/333 bicycle frames, 0/633 distinct-object frames.
    compound_enabled: true
    compound_fragment_length_min: 0.42   # m: a wheel chord is 0.57 m nominal; a
                                         # 0.4 m object cannot reach 0.42 m, so
                                         # this excludes the Stage-4G3 obstacle
                                         # on geometry rather than on tuning
    compound_fragment_length_max: 0.80   # m: longer than any bicycle wheel
    compound_fragment_thickness_max: 0.10  # m: a tyre is ~0.04 m across
    compound_alignment_min: 0.98         # |cos|, i.e. 11.5 deg: both chords lie
                                         # along the wheel-to-wheel line
    compound_separation_min: 0.80        # m: plausible wheelbase, low end
    compound_separation_max: 1.35        # m: plausible wheelbase, high end
    compound_gap_min: 0.35               # m: == cluster_distance. A floor only;
                                         # two separate clusters always exceed it
    compound_gap_max: 0.80               # m: bound on the empty span spanned
    compound_union_length_min: 1.00      # m: wheelbase plus two chords ~1.62 m
    compound_union_length_max: 2.00      # m
    compound_union_thickness_max: 0.08   # m: THE decisive bound -- both wheels
                                         # share one plane, two objects do not
    compound_union_fill_max: 0.90        # a bicycle cannot read as solid
    compound_min_support: 3              # scans: == min_observations_to_publish,
                                         # so the temporal requirement costs no
                                         # latency the pipeline did not already have
    compound_separation_tolerance: 0.12  # m: ~5x the measured 0.017-0.025 m
                                         # per-scenario separation sigma
    compound_match_radius: 0.35          # m: 2.3x the 0.151 m/scan an actor at
                                         # the set's fastest 0.75 m/s travels
    compound_max_gap_seconds: 0.30       # s: just over one 4.98 Hz scan period,
                                         # so support must be CONSECUTIVE

    # --- Stage-4G4: conservative bounded-motion reachability -----------
    # An ADDITIONAL future-motion representation, published in the new
    # TrackedObject.reachability_predictions field. The Stage-4C constant-
    # velocity Gaussian prediction above is completely unchanged, so every
    # Stage-4D / 4E / 4F result remains reproducible; set reachability_enabled
    # to false to return to a byte-identical Stage-4G3 message payload.
    #
    # These are PHYSICAL bounds on obstacle motion, chosen from what the
    # obstacle can do, not from what makes navigation look good:
    #
    # max_acceleration 0.5 m/s^2 is the bound the Stage-4G4 scenario driver
    #   COMMANDS for its ramped manoeuvres (scenarios.json "accel" field), so
    #   the model and the world share one declared bound. Measured honestly and
    #   recorded here: the same Gazebo VelocityControl plugin can also apply a
    #   STEP velocity change -- |a| of 5-9.5 m/s^2 was measured in the retained
    #   Stage-4G3 GT odometry at segment boundaries -- and NO finite
    #   acceleration bound covers a step change at short horizon. The step
    #   scenarios are kept as an out-of-model stress test and reported as such.
    # max_speed 0.8 m/s: scenario obstacles run at 0.15-0.50 m/s; this leaves
    #   headroom without licensing motion the models never perform. The cap can
    #   only shrink the reachable radius, never grow it.
    #
    #   STAGE-5C.1 -- THIS IS A VALIDITY PREMISE, NOT A TUNING KNOB. The
    #   reachable set is a BOUND only while |v(s)| <= max_speed holds for the
    #   entire prediction window. Setting this value is ASSERTING that no
    #   tracked obstacle in the deployment can exceed it. Stage-5C measured the
    #   cost of that assertion being wrong: observed s0 = 0, cap 0.8 m/s, true
    #   capability 1.4 m/s gives a model reach of 2.56 m at t = 4.0 s against a
    #   true reach of 3.64 m -- a 1.08 m escape (worst tested 1.44 m) INSIDE the
    #   production total-time window of max_observation_age + reachability_
    #   horizon = 4.0 s. Current simulation obstacles reach 0.75 m/s, so 0.8 m/s
    #   holds for the qualified experiments; a faster obstacle class REQUIRES
    #   this value to be raised, not merely re-tuned.
    #
    #   WHAT RUNTIME ENFORCES, AND WHAT IT CANNOT. The premise quantifies over
    #   the FUTURE, so no runtime check can verify it, and none is claimed. The
    #   observable half is the contradiction: a filtered speed above the cap
    #   proves the obstacle is capable of that speed and therefore DISPROVES the
    #   premise. That is detected, published in
    #   ReachabilityPrediction.contract_status, warned about, and answered by
    #   raising the cap to the weakest observation-consistent value. The
    #   UNOBSERVABLE residual -- true capability above the cap while the
    #   filtered speed stays below it -- is NOT enforceable at runtime and
    #   remains a declared assumption of this file.
    # base_safety_margin 0.0: deterministic body allowance, deliberately zero
    #   so the published region measures the motion model alone. Giving
    #   reachability a free additive margin would make the comparison against
    #   the CV covariance ellipse unfair; the costmap layer applies its own.
    # covariance_sigma_level 2.0: matches the Stage-4D layer's sigma_level, so
    #   the statistical term of the reachable region and the CV ellipse it is
    #   compared against use the SAME k on the SAME covariance.
    # max_observation_age 1.0 s: equals track_timeout below, so a region never
    #   outlives the track that produced it.
    reachability_enabled: true
    max_acceleration: 0.5          # m/s^2, isotropic |a| bound
    max_speed: 0.8                 # m/s, |v| bound
    reachability_horizon: 3.0      # s, mirrors prediction_horizon
    reachability_time_step: 0.5    # s, mirrors prediction_time_step
    base_safety_margin: 0.0        # m, deterministic; 0 => model-only region
    max_observation_age: 1.0       # s, == track_timeout
    covariance_sigma_level: 2.0    # k for the STATISTICAL term only
    # --- Stage-5C.1 validity contract ---------------------------------------
    # reachability_enforce_observed_speed: on an OBSERVABLE breach, recompute
    #   with v_eff = max(max_speed, observed_speed) -- the weakest premise
    #   observation does not contradict. Monotone-safe: it can only enlarge the
    #   region, never drop or shrink it, and in domain it is a no-op whose
    #   output is bit-identical to Stage-5C. false restores the pre-Stage-5C.1
    #   arithmetic and exists only so the regression test can reproduce the old
    #   behaviour -- it lets a disproved bound keep being published as if it
    #   held, so it is NOT a production setting.
    # reachability_max_speed_tolerance: numeric dead-band, deliberately at
    #   float scale. NOT widened to absorb estimator transients: the Stage-5C
    #   recordings show the filtered speed exceeding this cap by up to
    #   0.131 m/s on tracks that are genuinely in domain, while Stage-5C's
    #   adversary measured real escapes for s0 in [0.80, 0.95] -- a dead-band
    #   wide enough for the former would mask the latter. Transients are made
    #   harmless by the response above being monotone-safe instead. The
    #   under-coverage conceded is at most 1e-6 m/s * 4.0 s = 4e-6 m.
    reachability_enforce_observed_speed: true
    reachability_max_speed_tolerance: 1.0e-6   # m/s

    # Gated nearest-neighbour association + track lifecycle.
    association_gate: 0.6
    track_timeout: 1.0
    max_missed_scans: 5
    min_observations_to_publish: 3
    velocity_history_size: 5

    publish_candidate_markers: true
    velocity_marker_scale: 1.0
    tf_lookup_timeout: 0.1

    # --- Stage-4C: constant-velocity Kalman filter ---
    # 1-sigma unmodeled-acceleration noise (m/s^2), drives Q(dt). Generic
    # slow-indoor-obstacle default (see node comments); not tuned to one run.
    kf_process_accel_noise: 0.5
    # 1-sigma position measurement noise (m), drives R.
    kf_measurement_noise: 0.05
    kf_initial_position_variance: 0.01      # m^2
    kf_initial_velocity_variance: 4.0       # (m/s)^2 -- large: velocity unknown at track birth
    kf_min_dt: 0.001                        # s, numerical safety floor
    kf_max_dt: 1.0                          # s, numerical safety ceiling (== track_timeout)
    min_observations_for_kalman_velocity: 2 # observations before velocity is trusted

    # --- Stage-4C: future trajectory prediction ---
    prediction_horizon: 3.0        # s
    prediction_time_step: 0.5      # s -> samples at 0.5, 1.0, ..., 3.0 s
    uncertainty_ellipse_sigma: 2.0 # ellipse semi-axis = sigma * sqrt(eigenvalue of P_pos)
